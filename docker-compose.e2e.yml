services:
  postgres-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${TEST_USER_USER}
      POSTGRES_PASSWORD: ${TEST_USER_PASSWORD}
      POSTGRES_DB: ${TEST_USER_DB}
    ports:
      - '5434:5432' 
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test']
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  redis-e2e:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  mongo-e2e:
    image: mongo:7
    ports:
      - '27018:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 2s
      timeout: 3s
      retries: 15