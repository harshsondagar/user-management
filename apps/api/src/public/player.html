<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>HLS Test Player</title>
  </head>
  <body>
    <h2>Upload and play</h2>

    <input type="file" id="file" accept="video/*" />
    <button id="btn">Upload</button>
    <p id="status"></p>

    <video id="video" controls width="720"></video>
    <p>
      Quality:
      <select id="quality">
        <option value="-1">Auto</option>
      </select>
    </p>
    <p id="current"></p>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>

    <script>
      const API = '/api'; // your global prefix
      const video = document.getElementById('video');
      const status = document.getElementById('status');
      const btn = document.getElementById('btn');
      let hls = null;
      let timer = null;

      // Reads { success, data } and returns data, or throws on failure
      async function unwrap(res) {
        const body = await res.json().catch(() => null);
        if (!res.ok || !body?.success) {
          const msg =
            body?.message || body?.error || `Request failed (${res.status})`;
          throw new Error(Array.isArray(msg) ? msg.join(', ') : msg);
        }
        return body.data;
      }

      function play(src) {
        if (hls) {
          hls.destroy(); // clean up a previous video
          hls = null;
        }

        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(src);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            const sel = document.getElementById('quality');
            sel.length = 1; // keep "Auto"
            hls.levels.forEach((lvl, i) => {
              sel.add(new Option(lvl.height + 'p', i));
            });
            sel.onchange = () => (hls.currentLevel = parseInt(sel.value)); // -1 = auto
          });

          hls.on(Hls.Events.LEVEL_SWITCHED, (e, data) => {
            const lvl = hls.levels[data.level];
            document.getElementById('current').textContent =
              `Now playing: ${lvl.height}p (${Math.round(lvl.bitrate / 1000)} kbps)`;
          });

          hls.on(Hls.Events.ERROR, (e, data) =>
            console.error('HLS error:', data),
          );
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = src; // Safari / iOS
        }
      }

      function stopPolling() {
        if (timer) clearInterval(timer);
        timer = null;
        btn.disabled = false;
      }

      btn.onclick = async () => {
        const f = document.getElementById('file').files[0];
        if (!f) return alert('Choose a video first');

        stopPolling();
        btn.disabled = true;

        const fd = new FormData();
        fd.append('video', f);
        status.textContent = 'Uploading...';

        let upload;
        try {
          // data = { videoId, status, statusUrl }
          upload = await unwrap(
            await fetch(`${API}/hls/upload`, { method: 'POST', body: fd }),
          );
        } catch (e) {
          status.textContent = e.message;
          btn.disabled = false;
          return;
        }

        const statusUrl = `${API}${upload.statusUrl}`; // /api/hls/status/<id>
        status.textContent = 'Queued...';

        timer = setInterval(async () => {
          try {
            // data = { status, progress, playlistUrl?, error? }
            const s = await unwrap(await fetch(statusUrl));

            if (s.status === 'completed') {
              stopPolling();
              status.textContent = 'Done!';
              play(`${API}${s.playlistUrl}`); // /api/stream/<id>/master.m3u8
            } else if (s.status === 'failed') {
              stopPolling();
              status.textContent = s.error || 'Conversion failed';
            } else {
              status.textContent = `Status: ${s.status} (${s.progress}%)`;
            }
          } catch (e) {
            stopPolling();
            status.textContent = e.message;
          }
        }, 2000);
      };
    </script>
  </body>
</html>
